  /* ---------- Header ---------- */
  header{
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:28px 36px;
    z-index:20;
    pointer-events:none;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:4px;
    color:var(--cream);
    text-shadow:0 2px 10px rgba(0,0,0,0.45);
  }
  .brand .eyebrow{
    font-size:13px;
    letter-spacing:0.14em;
    color:#E4D9C6;
    opacity:0.9;
  }
  .brand h1{
    margin:0;
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.02em;
  }

  /* ---------- Clock ---------- */
  #clock-box{
    pointer-events:auto;
    background:rgba(38,32,26,0.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(244,238,227,0.28);
    border-radius:14px;
    padding:14px 20px;
    color:var(--cream);
    text-align:right;
    min-width:190px;
  }
  #clock-time{
    font-family:'Space Mono', monospace;
    font-size:30px;
    font-weight:700;
    letter-spacing:0.03em;
    line-height:1.1;
  }
  #clock-date{
    font-size:13px;
    margin-top:4px;
    color:#E4D9C6;
    letter-spacing:0.03em;
  }

  /* ---------- Main layout ---------- */
  main{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:140px 24px 60px;
  }

  .panel{
    width:100%;
    max-width:760px;
    background:var(--card);
    backdrop-filter:blur(6px);
    border:1px solid var(--card-line);
    border-radius:18px;
    box-shadow:0 24px 60px rgba(20,16,12,0.35);
    overflow:hidden;
  }
  .panel-head{
    padding:30px 34px 20px;
    border-bottom:1px solid var(--card-line);
  }
  .panel-head h2{
    margin:0 0 8px;
    font-family:'Noto Serif TC', serif;
    font-size:23px;
    color:var(--teal-deep);
  }
  .panel-head p{
    margin:0;
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink-soft);
    max-width:56ch;
  }

  .panel-body{
    padding:26px 34px 34px;
  }

  /* dropzone */
  #dropzone{
    border:1.5px dashed var(--stone-dark);
    border-radius:14px;
    padding:38px 24px;
    text-align:center;
    cursor:pointer;
    transition:background 0.18s ease, border-color 0.18s ease;
    background:rgba(200,173,143,0.10);
  }
  #dropzone.drag{
    background:rgba(63,92,78,0.10);
    border-color:var(--teal);
  }
  #dropzone svg{
    width:34px; height:34px;
    stroke:var(--teal-deep);
    margin-bottom:10px;
  }
  #dropzone .dz-title{
    font-size:15.5px;
    font-weight:500;
    color:var(--ink);
  }
  #dropzone .dz-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  #dropzone .dz-sub b{
    color:var(--teal-deep);
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  #file-input{ display:none; }

  .type-row{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .type-chip{
    font-size:12px;
    padding:5px 11px;
    border-radius:999px;
    border:1px solid var(--card-line);
    color:var(--ink-soft);
    background:rgba(255,255,255,0.5);
  }

  /* file list */
  #file-list{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .file-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border:1px solid var(--card-line);
    border-radius:11px;
    background:rgba(255,255,255,0.55);
  }
  .file-icon{
    width:34px; height:34px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:700;
    color:#fff;
    flex-shrink:0;
    letter-spacing:0.02em;
  }
  .file-icon.structured{ background:var(--teal); }
  .file-icon.unstructured{ background:var(--stone-dark); }
  .file-icon.unknown{ background:#8A8A8A; }

  .file-meta{ flex:1; min-width:0; }
  .file-name{
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .file-sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .file-tag{
    font-size:11px;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .file-tag.structured{ background:rgba(63,92,78,0.14); color:var(--teal-deep); }
  .file-tag.unstructured{ background:rgba(140,111,82,0.16); color:var(--stone-dark); }
  .file-tag.unknown{ background:rgba(0,0,0,0.08); color:#666; }

  .remove-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--brick);
    font-size:18px;
    line-height:1;
    padding:4px 6px;
    border-radius:6px;
  }
  .remove-btn:hover{ background:rgba(154,76,57,0.12); }
  .remove-btn:focus-visible, .type-chip:focus-visible, #dropzone:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:2px;
  }

  /* upload status / report panel */
  .file-status{
    font-size:11px;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .file-status.pending{ background:rgba(0,0,0,0.06); color:#666; }
  .file-status.unsupported{ background:rgba(0,0,0,0.06); color:#999; }
  .file-status.uploading{ background:rgba(169,194,204,0.4); color:var(--teal-deep); }
  .file-status.done{ background:rgba(63,92,78,0.16); color:var(--teal-deep); }
  .file-status.error{ background:rgba(154,76,57,0.14); color:var(--brick); }

  .file-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .action-link{
    font-size:12px;
    color:var(--teal-deep);
    background:none;
    border:none;
    text-decoration:none;
    border-bottom:1px dashed var(--teal-deep);
    cursor:pointer;
    padding:0;
  }
  .action-link:hover{ opacity:0.7; }

  .report-panel{
    display:none;
    margin:0 14px 4px 60px;
    padding:10px 12px;
    border-radius:9px;
    background:rgba(255,255,255,0.6);
    border:1px dashed var(--card-line);
    font-size:12px;
    color:var(--ink-soft);
  }
  .report-panel.open{ display:block; }
  .report-panel table{ width:100%; border-collapse:collapse; margin-top:6px; }
  .report-panel th, .report-panel td{
    border:1px solid var(--card-line);
    padding:4px 6px;
    text-align:left;
    font-size:11px;
  }
  .report-panel .err-msg{ color:var(--brick); }

  #empty-hint{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    padding:14px 0 2px;
  }

  .panel-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--card-line);
  }
  .count-info{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .submit-btn{
    background:var(--teal-deep);
    color:var(--cream);
    border:none;
    padding:11px 24px;
    border-radius:9px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .submit-btn:hover{ background:#1c2a23; }
  .submit-btn:disabled{
    background:#B8B0A6;
    cursor:not-allowed;
  }

  @media (max-width: 600px){
    header{ padding:18px 18px; flex-direction:column; gap:14px; }
    #clock-box{ align-self:flex-end; }
    main{ padding:150px 14px 40px; }
    .panel-head, .panel-body{ padding-left:22px; padding-right:22px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  /* ---------- 登入頁專屬樣式 ---------- */
  .login-main{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:140px 24px 60px;
  }
  .login-panel{
    width:100%;
    max-width:420px;
    background:var(--card);
    backdrop-filter:blur(6px);
    border:1px solid var(--card-line);
    border-radius:18px;
    box-shadow:0 24px 60px rgba(20,16,12,0.35);
    overflow:hidden;
  }
  .login-panel .panel-head{
    padding:30px 34px 20px;
    border-bottom:1px solid var(--card-line);
  }
  .login-panel .panel-body{
    padding:26px 34px 34px;
  }
  .login-field{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-bottom:20px;
  }
  .login-field label{
    font-size:13.5px;
    font-weight:500;
    color:var(--ink-soft);
  }
  .login-field input{
    font-family:'Noto Sans TC', sans-serif;
    font-size:15px;
    padding:12px 14px;
    border:1.5px solid var(--card-line);
    border-radius:10px;
    background:rgba(255,255,255,0.7);
    color:var(--ink);
    outline:none;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .login-field input:focus{
    border-color:var(--teal);
    background:#fff;
  }
  .login-submit{
    width:100%;
    background:var(--teal-deep);
    color:var(--cream);
    border:none;
    padding:13px 24px;
    border-radius:10px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.15s ease;
    margin-top:4px;
  }
  .login-submit:hover{ background:#1c2a23; }
  .login-msg{
    display:none;
    font-size:13.5px;
    padding:11px 14px;
    border-radius:10px;
    margin-bottom:18px;
    line-height:1.6;
  }
  .login-msg.show{ display:block; }
  .login-msg.error{
    background:rgba(154,76,57,0.12);
    color:var(--brick);
    border:1px solid rgba(154,76,57,0.28);
  }
  .login-msg.success{
    background:rgba(63,92,78,0.14);
    color:var(--teal-deep);
    border:1px solid rgba(63,92,78,0.3);
  }
  .login-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    opacity:0.85;
    margin-top:18px;
    line-height:1.7;
  }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }
  .login-panel.shake{ animation:shake 0.4s ease; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="eyebrow">TAIPEI CITY GOVERNMENT</span>
    <h1>去識別化平台</h1>
  </div>
  <div id="clock-box">
    <div id="clock-time">--:--:--</div>
    <div id="clock-date">----年--月--日</div>
  </div>
</header>

<main class="login-main">
  <div class="login-panel" id="login-panel">
    <div class="panel-head">
      <h2 style="text-align: center;">登入</h2>
      <p style="text-align: center;">請輸入帳號密碼以繼續使用去識別化平台。</p>
    </div>

    <div class="panel-body">
      <div class="login-msg error" id="msg-error">帳號或密碼錯誤，請重新輸入。</div>
      <div class="login-msg success" id="msg-success">登入成功，正在為您跳轉…</div>

      <form id="login-form" novalidate>
        <div class="login-field">
          <label for="username">帳號</label>
          <input type="text" id="username" name="username" autocomplete="username"  required>
        </div>
        <div class="login-field">
          <label for="password">密碼</label>
          <input type="password" id="password" name="password" autocomplete="current-password"  required>
        </div>
        <button type="submit" class="login-submit" id="login-submit">登入</button>
      </form>


    </div>
  </div>
</main>

<script>
  /* ---------- 即時時鐘 ---------- */
  const timeEl = document.getElementById('clock-time');
  const dateEl = document.getElementById('clock-date');
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  function pad(n){ return String(n).padStart(2,'0'); }

  function updateClock(){
    const now = new Date();
    timeEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    dateEl.textContent = `${now.getFullYear()}年${pad(now.getMonth()+1)}月${pad(now.getDate())}日 ${weekdays[now.getDay()]}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ---------- 登入邏輯 ---------- */
  // 帳號格式：nc + 四碼數字（例如 nc1234）
  const USERNAME_PATTERN = /^nc\d{4}$/;
  // 密碼格式：Taipei# + 四碼入職日期（例如 Taipei#0101）
  const PASSWORD_PATTERN = /^Taipei#\d{4}$/;

  // 登入成功後要跳轉回去的原網頁，請視實際檔名調整
  const REDIRECT_TARGET = '去識別平台.html';

  const form = document.getElementById('login-form');
  const panel = document.getElementById('login-panel');
  const errorMsg = document.getElementById('msg-error');
  const successMsg = document.getElementById('msg-success');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const submitBtn = document.getElementById('login-submit');

  function hideMessages(){
    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');
  }

  function showError(){
    hideMessages();
    errorMsg.classList.add('show');
    panel.classList.remove('shake');
    void panel.offsetWidth; // 重新觸發動畫
    panel.classList.add('shake');
    passwordInput.value = '';
    passwordInput.focus();
  }

  function showSuccessAndRedirect(){
    hideMessages();
    successMsg.classList.add('show');
    submitBtn.disabled = true;
    submitBtn.textContent = '登入成功，跳轉中…';
    try {
      // 記錄登入狀態，讓主頁面知道使用者是從這個登入頁通過驗證的
      sessionStorage.setItem('nc_authed', 'true');
    } catch (e) {}
    setTimeout(() => {
      window.location.href = REDIRECT_TARGET;
    }, 900);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    const ok = USERNAME_PATTERN.test(username) && PASSWORD_PATTERN.test(password);

    if (ok) {
      showSuccessAndRedirect();
    } else {
      showError();
    }
  });

  // 如果這頁是從瀏覽器快取還原回來的（例如登入成功跳轉到主頁後，又按「上一頁」回到這裡），
  // 把表單重置成乾淨的初始狀態，避免畫面卡在「登入成功，正在為您跳轉…」那個瞬間
  window.addEventListener('pageshow', function(event){
    if (event.persisted) {
      hideMessages();
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = '登入';
    }
  });
</script>

</body>
</html>
